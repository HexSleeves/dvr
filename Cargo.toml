[workspace]
resolver = "2"
members = ["crates/dvr-proto", "crates/dvr-engine", "crates/dvr-daemon", "crates/dvr-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[workspace.dependencies]
jj-lib = "=0.45.1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
axum = "0.8"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hyperlocal = "0.9"
http-body-util = "0.1"
notify = "8"
notify-debouncer-full = "0.7"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
tempfile = "3"
# Already in the tree via jj-lib; used for the daemon-singleton flock.
rustix = { version = "1", features = ["fs"] }
